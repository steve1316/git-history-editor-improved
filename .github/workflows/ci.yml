name: CI

on:
    push:
        branches: [master]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: yarn
            - run: yarn install --frozen-lockfile
            - run: yarn typecheck
            - run: yarn lint
            - run: yarn test
            - run: yarn build
            - uses: actions/upload-pages-artifact@v4
              if: github.ref == 'refs/heads/master'
              with:
                  path: dist

    deploy:
        needs: verify
        if: github.ref == 'refs/heads/master'
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
